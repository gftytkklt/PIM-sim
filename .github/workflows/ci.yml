name: PIM-sim CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ libboost-all-dev libboost-json-dev libgtest-dev pybind11-dev \
            python3 python3-dev python3-pip python3-venv

      - name: Python analysis dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-analysis.txt

      - name: Build and test
        run: |
          scripts/build.sh -DCMAKE_BUILD_TYPE=Release
          ctest --test-dir build/default --output-on-failure --no-tests=error --timeout 60
          scripts/python.sh -m unittest discover -s tests/python -p 'test_*.py' -v
          python3 scripts/check_repository.py

      - name: Address and undefined behavior checks
        run: |
          BUILD_DIR=build/sanitized scripts/build.sh -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build/sanitized --output-on-failure --no-tests=error --timeout 60
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            scripts/python.sh scripts/regression/verify_simulator_traces.py \
              --normal build/default --sanitized build/sanitized --output artifacts/tests/ci-traces.json
